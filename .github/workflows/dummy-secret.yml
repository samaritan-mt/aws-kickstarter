on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  pr:
    if: github.event_name == 'pull_request'
    environment: shared
    runs-on: ubuntu-latest
    steps:
      - name: Show my secret (pull request)
        run: |
          set -euo pipefail
          echo "MY_SECRET=$MY_SECRET"
  
  branch:
    if: github.event_name == 'push'
    environment: shared
    runs-on: ubuntu-latest
    steps:
      - name: Show my secret (branch, no environment)
        run: |
          set -euo pipefail
          echo "MY_SECRET=$MY_SECRET"

  env:
    if: github.event_name != 'pull_request'
    environment: shared
    runs-on: ubuntu-latest
    steps:
      - name: Show my secret (environment shared)
        run: |
          set -euo pipefail
          echo "MY_SECRET=$MY_SECRET"