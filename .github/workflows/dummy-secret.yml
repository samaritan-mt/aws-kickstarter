name: dummy-secret

# Throwaway (task T3). Dummy secrets only: REPO_SECRET (repository) and ENV_SECRET (environment shared).
# Shows which secrets each context sees, and that masking covers only the exact value.
# Delete this file and both secrets after recording the results.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Show secrets (pull request, no environment)
        env:
          REPO_SECRET: ${{ secrets.REPO_SECRET }}
          ENV_SECRET: ${{ secrets.ENV_SECRET }}
        run: |
          set -euo pipefail
          echo "REPO exact: $REPO_SECRET"
          echo "ENV exact: $ENV_SECRET"
          echo "ENV length: ${#ENV_SECRET}"
          echo "REPO base64 (derived, expected NOT masked): $(printf '%s' "$REPO_SECRET" | base64)"

  branch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Show secrets (push to main, no environment)
        env:
          REPO_SECRET: ${{ secrets.REPO_SECRET }}
          ENV_SECRET: ${{ secrets.ENV_SECRET }}
        run: |
          set -euo pipefail
          echo "REPO exact: $REPO_SECRET"
          echo "ENV exact: $ENV_SECRET"
          echo "ENV length: ${#ENV_SECRET}"
          echo "REPO base64 (derived, expected NOT masked): $(printf '%s' "$REPO_SECRET" | base64)"

  with-env:
    if: github.event_name != 'pull_request'
    environment: shared
    runs-on: ubuntu-latest
    steps:
      - name: Show secrets (environment shared)
        env:
          REPO_SECRET: ${{ secrets.REPO_SECRET }}
          ENV_SECRET: ${{ secrets.ENV_SECRET }}
        run: |
          set -euo pipefail
          echo "REPO exact: $REPO_SECRET"
          echo "ENV exact: $ENV_SECRET"
          echo "ENV length: ${#ENV_SECRET}"
          echo "ENV base64 (derived, expected NOT masked): $(printf '%s' "$ENV_SECRET" | base64)"
